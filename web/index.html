<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E07A55">
<title>North Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Della+Respira&family=Ysabeau+Office:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nsjw.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sgraffito.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="screen">

  <!-- Sign in -->
  <section id="v-signin" class="view" hidden>
    <header class="art">
      <div class="eyebrow">North Star Jazz Workshops</div>
      <h1>Student Journey</h1>
    </header>
    <main class="signin">
      <p class="muted">Sign in with your North Star Google account.</p>
      <div id="gsi-button"></div>
      <p id="signin-error" class="error" hidden></p>
    </main>
  </section>

  <!-- People -->
  <section id="v-people" class="view" hidden>
    <header class="art">
      <div class="row-top">
        <div class="eyebrow">North Star Jazz Workshops</div>
        <button class="link" id="signout" type="button">Sign out</button>
      </div>
      <h1>People</h1>
    </header>
    <main>
      <input id="q" class="search" type="search" placeholder="Search name, email, group, instrument" autocomplete="off">
      <div class="chips" id="status-chips" role="tablist">
        <button class="chip on" data-status="">All</button>
        <button class="chip" data-status="Lead">Lead</button>
        <button class="chip" data-status="Trial">Trial</button>
        <button class="chip" data-status="Waiting">Waiting</button>
        <button class="chip" data-status="Active">Active</button>
        <button class="chip" data-status="Inactive">Inactive</button>
      </div>
      <div id="people-list" class="list"></div>
    </main>
  </section>

  <!-- Lessons -->
  <section id="v-lessons" class="view" hidden>
    <header class="art black">
      <div class="eyebrow">Private lessons</div>
      <h1>Lessons</h1>
    </header>
    <main>
      <div class="stats" id="lesson-stats"></div>
      <div class="chips" id="stage-chips">
        <button class="chip on" data-stage="Active">Active</button>
        <button class="chip" data-stage="Scheduling">Scheduling</button>
        <button class="chip" data-stage="Cancelling">Cancelling</button>
        <button class="chip" data-stage="Ended">Ended</button>
        <button class="chip" data-stage="">All</button>
      </div>
      <select id="teacher-filter" class="search select"><option value="">All teachers</option></select>
      <div id="lesson-list" class="list"></div>
    </main>
  </section>

  <!-- Groups -->
  <section id="v-groups" class="view" hidden>
    <header class="art black">
      <div class="eyebrow" id="groups-eyebrow">Ensembles, classes and clinics</div>
      <h1>Groups</h1>
    </header>
    <main>
      <div class="whenbar" id="when-tabs" role="tablist">
        <button class="tab on" data-when="Current">Current</button>
        <button class="tab" data-when="Upcoming">Upcoming</button>
        <button class="tab" data-when="Past">Past</button>
      </div>
      <div class="chips" id="kind-chips">
        <button class="chip on" data-kind="">All</button>
        <button class="chip" data-kind="Ensemble">Ensembles</button>
        <button class="chip" data-kind="Class">Classes</button>
        <button class="chip" data-kind="Clinic">Clinics</button>
        <button class="chip" data-kind="open">Open seats</button>
      </div>
      <div class="groups-sum muted" id="groups-sum"></div>
      <div id="group-list" class="list"></div>
    </main>
  </section>

  <!-- Group -->
  <section id="v-group" class="view" hidden>
    <header class="art">
      <div class="row-top"><a class="back" href="#groups">&#8249; Groups</a></div>
      <div>
        <div class="eyebrow" id="group-eyebrow"></div>
        <h1 id="group-name"></h1>
        <div class="group-sched" id="group-sched"></div>
      </div>
    </header>
    <main id="group"></main>
  </section>

  <!-- Person -->
  <section id="v-person" class="view" hidden>
    <header class="top">
      <a class="back" href="#people" aria-label="Back to people">&#8249; People</a>
      <a class="link" id="mms-link" target="_blank" rel="noopener">Open in MMS</a>
    </header>
    <main id="person"></main>
  </section>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#people" data-nav="people"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>People</a>
    <a href="#groups" data-nav="groups"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="14" cy="8" r="2.5"/><path d="M2 17c0-3 2.5-5 5-5s5 2 5 5M12 17c0-2 1.5-4 4-4"/></svg>Groups</a>
    <a href="#lessons" data-nav="lessons"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 15V4l9-2v11"/><circle cx="5.5" cy="15" r="2.5"/><circle cx="14.5" cy="13" r="2.5"/></svg>Lessons</a>
  </nav>

</div>

<!-- Edit lesson -->
<div id="lesson-sheet" class="sheet" hidden>
  <form id="lesson-form" class="sheet-body scroll">
    <div class="sheet-title" id="lesson-title">Lessons</div>
    <div class="row">
      <label>Stage
        <select name="Stage"><option>Scheduling</option><option>Active</option><option>Cancelling</option><option>Ended</option></select>
      </label>
      <label>Teacher <input name="Teacher" list="teacher-names"></label>
    </div>
    <div class="row">
      <label>Instrument <input name="Instrument"></label>
      <label>Frequency
        <select name="Frequency"><option></option><option>Weekly</option><option>Bi-Weekly</option><option>Monthly</option></select>
      </label>
    </div>
    <div class="row">
      <label>Day and time <input name="Day and time" placeholder="Tuesday 4-5pm"></label>
      <label>Length <input name="Length" placeholder="60 minutes"></label>
    </div>
    <div class="row">
      <label>Monthly cost <input name="Monthly cost" inputmode="decimal"></label>
      <label>Start date <input name="Start date" type="date"></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" name="Contract sent"> Contract sent</label>
      <label><input type="checkbox" name="Billed in MMS"> Billed in MMS</label>
      <label><input type="checkbox" name="Calendar invite sent"> Calendar invite sent</label>
    </div>
    <label>Cancellation date <input name="Cancellation date" type="date"></label>
    <label>Schedule notes <textarea name="Schedule notes" rows="2"></textarea></label>
    <div class="row end">
      <button type="button" class="btn" id="lesson-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="lesson-save">Save</button>
    </div>
  </form>
  <datalist id="teacher-names"></datalist>
</div>

<!-- Add note / next step -->
<div id="sheet" class="sheet" hidden>
  <form id="note-form" class="sheet-body">
    <div class="seg" role="tablist">
      <button type="button" class="seg-btn on" data-kind="note">Note</button>
      <button type="button" class="seg-btn" data-kind="next_step">Next step</button>
    </div>
    <textarea id="note-text" rows="4" placeholder="What happened, or what's next" required></textarea>
    <div class="row next-only" hidden>
      <label>Due <input id="note-due" type="date"></label>
      <label>Owner <input id="note-owner" type="text" placeholder="Ben"></label>
    </div>
    <div class="row end">
      <button type="button" class="btn" id="note-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="note-save">Save</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
